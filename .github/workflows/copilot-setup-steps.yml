# Prepares the GitHub Copilot coding agent environment so it can run ./build.ps1.
# https://docs.github.com/en/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The job MUST be called copilot-setup-steps.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester, PSScriptAnalyzer and Bicep CLI
        shell: pwsh
        run: ./build.ps1 -Task Bootstrap

      - name: Verify toolchain
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion
          Get-Module -ListAvailable Pester, PSScriptAnalyzer | Select-Object Name, Version
          bicep --version 2>$null; if ($LASTEXITCODE -ne 0) { az bicep version }
